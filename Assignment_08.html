<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Links and Images</title></head>
<body id="top">
  <h2>Links demo</h2>
  <p><a href="https://www.google.com/" target="_blank" rel="noopener">External link</a></p>
  <p><a href="#bottom">Jump to bottom</a></p>
  <p><a href="mailto:student@example.com">Email us</a></p>
  <p><a href="https://www.example.com/" target="_blank" rel="noopener" aria-label="Open example website">
    <img src="https://via.placeholder.com/100x50?text=Logo" alt="Sample logo" width="100" height="50">
  </a></p>
  <div style="height:500px"></div>
  <p id="bottom">Bottom. <a href="#top">Back to top</a></p>
</body>
</html>
