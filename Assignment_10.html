<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>HTML Multimedia</title></head>
<body>
  <h3>Image</h3>
  <img src="https://via.placeholder.com/300x150?text=College+Campus" alt="Sample college campus" width="300">
  <h3>Video</h3>
  <video controls width="320">
    <source src="sample-video.mp4" type="video/mp4">
    Your browser does not support the video element.
  </video>
  <h3>Audio</h3>
  <audio controls>
    <source src="sample-audio.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>
  <h3>YouTube</h3>
  <iframe width="320" height="180" src="https://www.youtube.com/embed/tgbNymZ7vqY"
    title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen></iframe>
  <p><small>Keep sample-video.mp4 and sample-audio.mp3 in this same folder to play your own media files.</small></p>
</body>
</html>
