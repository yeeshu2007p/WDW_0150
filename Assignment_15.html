<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Personal Details Form</title></head>
<body>
<form>
  <fieldset>
    <legend>Personal Details</legend>
    <p><label for="name">Name:</label> <input id="name" name="name" type="text"></p>
    <p><label for="email">Email:</label> <input id="email" name="email" type="email"></p>
    <p><label for="password">Password:</label> <input id="password" name="password" type="password"></p>
    <p>Gender:
      <input id="male" name="gender" type="radio" value="Male"><label for="male">Male</label>
      <input id="female" name="gender" type="radio" value="Female"><label for="female">Female</label>
    </p>
    <p>Hobbies:
      <input id="reading" name="hobbies" type="checkbox" value="Reading"><label for="reading">Reading</label>
      <input id="coding" name="hobbies" type="checkbox" value="Coding"><label for="coding">Coding</label>
    </p>
    <p><label for="dob">DOB:</label> <input id="dob" name="dob" type="date"></p>
  </fieldset>
</form>
</body>
</html>
