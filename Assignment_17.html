<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Form Validation</title></head>
<body>
<form action="submit.php" method="post">
  <p><label for="fullName">Full name</label><br>
    <input id="fullName" name="fullName" type="text" placeholder="Full name" required></p>
  <p><label for="email">Email</label><br>
    <input id="email" name="email" type="email" placeholder="you@college.edu" required></p>
  <p><label for="mobile">Mobile</label><br>
    <input id="mobile" name="mobile" type="text" placeholder="10-digit mobile"
      pattern="[0-9]{10}" title="Enter exactly 10 digits" required></p>
  <p><label for="password">Password</label><br>
    <input id="password" name="password" type="password" placeholder="Min 6 characters"
      minlength="6" required></p>
  <p><label for="age">Age</label><br>
    <input id="age" name="age" type="number" placeholder="Age (17-30)" min="17" max="30" required></p>
  <button type="submit">Register</button>
</form>
<p><small>Note: This form demonstrates browser-side validation. A real submission also needs a server-side submit.php file.</small></p>
</body>
</html>
