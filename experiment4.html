<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Room Booking Form</title>
</head>
<body>

    
    <!-- Form Container centered with simple border styling -->
    <div style="width: 500px; margin: 0 auto; border: 1px solid black; padding: 20px;">
        <form action="#" method="post" align="center">
           <h1 align="center">Hotel Room Booking Form</h1>
 
            <!-- Full Name -->
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter Your Name" required>
            <br><br>

            <!-- Email -->
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter Your Email" required>
            <br><br>

            <!-- Phone -->
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter Your PhoneNo.">
            <br><br>

            <!-- Check-in Date -->
            <label for="checkin">Check-in Date:</label>
            <input type="date" id="checkin" name="checkin" required>
            <br><br>

            <!-- Check-out Date -->
            <label for="checkout">Check-out Date:</label>
            <input type="date" id="checkout" name="checkout" required>
            <br><br>

            <!-- Room Type Dropdown -->
            <label for="roomtype">Room Type:</label>
            <select id="roomtype" name="roomtype">
                <option value="single">Single Room</option>
                <option value="double">Double Room</option>
                <option value="suite">Suite</option>
            </select>
            <br><br>

            <!-- Number of Guests -->
            <label for="guests">Number of Guests:</label>
            <input type="number" id="guests" name="guests" min="1" max="10">
            <br><br>

            <!-- Special Requests Textarea -->
            <label for="requests">Special Requests:</label><br>
            <textarea id="requests" name="requests" rows="4" cols="40" placeholder="..."></textarea>
            <br><br>

            <!-- Action Buttons -->
            <input type="submit" value="Book Now">
            <input type="reset" value="Reset Form">

        </form>
    </div>

</body>
</html>
