<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABC College Admission 2026</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#f4f4f4;color:#222;font-family:Arial,sans-serif}
  header,footer{padding:12px;background:#202b83;color:white;text-align:center}main{max-width:650px;margin:20px auto;padding:20px;background:white}
  table{width:100%;margin:12px 0;border-collapse:collapse}th,td{padding:8px;border:1px solid #777;text-align:left}
  label{display:block;margin-top:12px}input,select,textarea{width:100%;margin-top:4px;padding:8px}button{margin-top:14px;padding:9px 18px}
  .skip{position:absolute;left:-9999px}.skip:focus{top:10px;left:10px;padding:8px;background:white}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<header><h1>ABC College Admission 2026</h1></header>
<main id="main">
  <section aria-labelledby="courses-heading">
    <h2 id="courses-heading">Courses and Fees</h2>
    <table>
      <caption>Available Courses</caption>
      <thead><tr><th scope="col">Course</th><th scope="col">Seats</th><th scope="col">Fees</th></tr></thead>
      <tbody>
        <tr><td>B.Tech CSE</td><td>120</td><td>₹90,000</td></tr>
        <tr><td>B.Tech ECE</td><td>60</td><td>₹85,000</td></tr>
      </tbody>
    </table>
  </section>
  <section aria-labelledby="form-heading">
    <h2 id="form-heading">Application Form</h2>
    <form action="#" method="post">
      <label for="student-name">Name:</label>
      <input id="student-name" name="name" type="text" required minlength="2">
      <label for="student-email">Email:</label>
      <input id="student-email" name="email" type="email" required>
      <label for="student-course">Course:</label>
      <select id="student-course" name="course" required>
        <option value="">Select a course</option><option>B.Tech CSE</option><option>B.Tech ECE</option>
      </select>
      <label for="statement">Statement:</label>
      <textarea id="statement" name="statement" rows="4" required></textarea>
      <button type="submit">Apply</button>
    </form>
  </section>
</main>
<footer>&copy; 2026 ABC College</footer>
</body>
</html>
