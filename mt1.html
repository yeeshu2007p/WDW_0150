<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multimedia Player</title>
</head>
<body align="center">

    <h1>Multimedia Player</h1>

    <h2>Audio Section</h2>
    <audio controls>
        <source src="song.mp3" type="audio/mpeg">
        
    </audio>

    <h2>Video Section</h2>
    <p>
        <video width="320" height="180" controls>
            <source src="college.mp4" type="video/mp4">
            
        </video>
    </p>

</body>
</html>
